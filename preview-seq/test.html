
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adam Frame Test</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050509;
}

#frame {
    width: 300px;
    height: 534px;
    object-fit: contain;
    display: block;
}
</style>
</head>

<body>

<img id="frame" src="frame-001.png" alt="">

<script>
const frame = document.getElementById("frame");
const total = 30;
let current = 1;

function nextFrame() {
    current++;

    if (current > total) {
        current = 1;
    }

    frame.src = `frame-${String(current).padStart(3, "0")}.png`;
}

setInterval(nextFrame, 40);
</script>

</body>
</html>
